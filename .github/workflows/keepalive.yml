# Free Hugging Face Spaces sleep after 48 h without traffic; a ping every 6 h keeps the worker awake.
name: keep worker awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping worker health endpoint
        env:
          URL: ${{ vars.WORKER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "set repo variable WORKER_HEALTH_URL"; exit 0; fi
          curl -fsS --max-time 30 "$URL" && echo
