# fly.toml app configuration file generated for launch-kit-worker on 2026-10-23T15:12:41+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'launch-kit-worker'
primary_region = 'sin'

[build]
  dockerfile = 'worker/Dockerfile'

[env]
  CAPTION_FONT = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
  CLAUDE_VISION_MODEL = 'claude-sonnet-5-5'
  CLAUDE_WRITER_MODEL = 'claude-opus-5-5'
  MOCK_MODE = 'false'
  SUPABASE_BUCKET = 'launches'
  WORK_DIR = '/tmp/launch-kit-work'

[processes]
  worker = 'npx tsx worker/index.ts'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['worker']
